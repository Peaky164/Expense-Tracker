name: Backend tests

on:
  push:
    branches: [main, sem6-dev]
  pull_request:
    branches: [main, sem6-dev]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -v

  docker-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t expense-tracker-api .

      - name: Smoke test the image
        run: docker run --rm expense-tracker-api python -c "import fastapi, sqlalchemy, psycopg, passlib, jose; print('imports ok')"