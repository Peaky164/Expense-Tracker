services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: expense
      POSTGRES_PASSWORD: local_dev_password
      POSTGRES_DB: expense_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U expense -d expense_db"]
      interval: 3s
      timeout: 3s
      retries: 10

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://expense:local_dev_password@db:5432/expense_db
      SECRET_KEY: fake-local-secret-not-for-production
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
